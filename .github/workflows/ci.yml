name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Package.swift needs swift-tools 6.2, which first ships with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      - run: swift test
